<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="eBISTRO Kasa">
<link rel="manifest" href="/kasa/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/pass/icon@3x.png">
<title>eBISTRO Kasa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap">
<style>
:root { --bg: #101010; --panel: #1C1C1C; --line: #333; --yellow: #F7CE1B; --ink: #F3F1EA; --soft: #9A9A9A; --green: #5BC236; --red: #E5534B; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 "Titillium Web", system-ui, sans-serif; }
body { padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left)); max-width: 520px; margin: 0 auto; }
button { font: inherit; cursor: pointer; border: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
header { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; }
header b { font-size: 18px; }
header button { background: none; color: var(--soft); font-size: 14px; }
[hidden] { display: none !important; }

/* PIN */
.pin { display: grid; gap: 18px; justify-items: center; padding-top: 8vh; }
.pin h1 { font-weight: 400; font-size: 22px; margin: 0; }
.dots-pin { display: flex; gap: 12px; height: 18px; }
.dots-pin i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--soft); }
.dots-pin i.on { background: var(--yellow); border-color: var(--yellow); }
.pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; }
.pad button { height: 76px; background: var(--panel); color: var(--ink); font-size: 26px; font-weight: 600; }
.pad button.ok { background: var(--yellow); color: #141414; font-size: 18px; }

/* Sken */
.cam { position: relative; aspect-ratio: 4 / 3; background: #1a1a19; overflow: hidden; display: grid; place-items: center; }
.cam video { width: 100%; height: 100%; object-fit: cover; }
.cam .frame { position: absolute; inset: 18% 24%; border: 3px solid var(--yellow); border-radius: 10px; box-shadow: 0 0 0 999px rgba(0,0,0,.3); pointer-events: none; }
.cam .msg { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 14px; color: #ddd; }
.cam button { background: var(--yellow); color: #141414; font-weight: 700; padding: 12px 18px; }
.manual { display: flex; gap: 8px; margin-top: 12px; }
.manual input::placeholder { text-transform: none; letter-spacing: 0; }
.manual input { flex: 1; min-width: 0; background: var(--panel); border: 1.5px solid var(--line); color: var(--ink); font: 600 17px/1 inherit; padding: 12px; text-transform: uppercase; letter-spacing: .04em; }
.manual button { background: var(--panel); color: var(--ink); border: 1.5px solid var(--line); padding: 0 16px; font-weight: 600; }

/* Karta */
.card { background: var(--panel); padding: 16px; margin-top: 14px; display: grid; gap: 12px; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card-h b { font-size: 18px; letter-spacing: .03em; }
.card-h span { color: var(--soft); font-size: 13px; }
.bar { display: flex; gap: 5px; }
.bar i { flex: 1; height: 10px; background: #333; }
.bar i.on { background: var(--yellow); }
.state { font-size: 15px; }
.state.full { color: var(--yellow); font-weight: 700; font-size: 18px; }
.btns { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
.big { padding: 16px; font-weight: 700; font-size: 18px; background: var(--yellow); color: #141414; }
.big.alt { background: #2a2a2a; color: var(--ink); }
.redeem { padding: 14px; font-weight: 700; font-size: 16px; background: transparent; color: #777; border: 1.5px solid #333; }
.redeem.ready { background: var(--green); color: #fff; border-color: var(--green); font-size: 18px; }
.confirm { background: #2b2410; border: 1.5px solid var(--yellow); padding: 12px; display: grid; gap: 10px; }
.confirm div { display: flex; gap: 8px; }
.confirm button { flex: 1; padding: 12px; font-weight: 700; }
.confirm .yes { background: var(--yellow); color: #141414; }
.confirm .no { background: #333; color: var(--ink); }
.next { background: none; color: var(--soft); text-decoration: underline; justify-self: center; padding: 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); width: min(488px, calc(100% - 32px)); background: #2a2a2a; border-left: 4px solid var(--green); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.toast.err { border-left-color: var(--red); }
.toast button { background: none; color: var(--yellow); font-weight: 700; }
.log { margin: 22px 0 90px; font-size: 13px; color: var(--soft); display: grid; gap: 4px; }
.log h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); margin: 0 0 4px; font-weight: 600; }
.log .undone { text-decoration: line-through; }
</style>
</head>
<body>
<header><b>eBISTRO Kasa</b><button id="logout" hidden>Odhlásit <span id="who"></span></button></header>

<section class="screen pin" id="s-pin" hidden>
  <h1>Zadejte svůj PIN</h1>
  <div class="dots-pin" id="pin-dots" aria-live="polite"></div>
  <div class="pad" id="pad"></div>
</section>

<section class="screen" id="s-main" hidden>
  <div class="cam" id="cam">
    <button id="start-cam" type="button">Zapnout fotoaparát</button>
  </div>
  <form class="manual" id="manual">
    <input id="code-in" placeholder="Kód z karty (EB-…)" autocomplete="off" aria-label="Kód karty">
    <button type="submit">Načíst</button>
  </form>
  <div id="card-box"></div>
  <div class="log" id="log"></div>
</section>

<div class="toast" id="toast" hidden><span id="toast-text"></span><button id="toast-undo" type="button" hidden>Vrátit</button></div>

<script src="/vendor/jsQR.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let me = null, current = null, stream = null, scanning = false, lastScan = '', toastTimer = null;

async function api(path, body) {
  const res = await fetch('/api' + path, body === undefined ? { credentials: 'same-origin' } : {
    method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'Chyba spojení'); e.status = res.status; e.code = data.code; throw e; }
  return data;
}

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v !== false) n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
}

function toast(text, { error = false, undoId = null } = {}) {
  $('toast-text').textContent = text;
  $('toast').classList.toggle('err', error);
  $('toast-undo').hidden = !undoId;
  $('toast-undo').onclick = undoId ? () => undo(undoId) : null;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, undoId ? 120000 : 4000);
}

function misky(n) { return n === 1 ? 'miska' : n >= 2 && n <= 4 ? 'misky' : 'misek'; }
function ago(iso) {
  if (!iso) return 'první návštěva';
  const d = Math.round((Date.now() - new Date(iso)) / 86400000);
  return d <= 0 ? 'naposledy dnes' : d === 1 ? 'naposledy včera' : `naposledy před ${d} dny`;
}

// ---------- PIN ----------
let pin = '';
function renderPin() {
  $('pin-dots').replaceChildren(...Array.from({ length: Math.max(4, pin.length) }, (_, i) => el('i', { class: i < pin.length ? 'on' : '' })));
}
function buildPad() {
  const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
  $('pad').replaceChildren(...keys.map((k) => el('button', { type: 'button', class: k === 'OK' ? 'ok' : '', 'aria-label': k === '⌫' ? 'Smazat' : k, onclick: () => key(k) }, k)));
}
async function key(k) {
  if (k === '⌫') pin = pin.slice(0, -1);
  else if (k === 'OK') return login();
  else if (pin.length < 8) pin += k;
  renderPin();
}
async function login() {
  try { me = await api('/staff/login', { pin }); pin = ''; renderPin(); await boot(); }
  catch (e) { pin = ''; renderPin(); toast(e.message, { error: true }); }
}

// ---------- Fotoaparát a sken ----------
async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch {
    toast('Fotoaparát nejde zapnout. Povolte ho v prohlížeči, nebo napište kód ručně.', { error: true });
    return;
  }
  const video = el('video', { playsinline: true, muted: true, autoplay: true });
  video.srcObject = stream;
  $('cam').replaceChildren(video, el('div', { class: 'frame' }), el('div', { class: 'msg', id: 'cam-msg' }, 'Namiřte na QR kód na kartě'));
  await video.play();
  scanning = true;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const detector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
  const tick = async () => {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      let value = null;
      if (detector) {
        try { value = (await detector.detect(video))[0]?.rawValue || null; } catch { value = null; }
      } else {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        value = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' })?.data || null;
      }
      if (value && value !== lastScan) { lastScan = value; if (navigator.vibrate) navigator.vibrate(60); await load(value); }
    }
    setTimeout(tick, 150);
  };
  tick();
}

// ---------- Karta ----------
async function load(code) {
  try { current = await api('/cards/' + encodeURIComponent(code)); renderCard(); }
  catch (e) { toast(e.status === 404 ? 'Tohle není karta eBISTRO.' : e.message, { error: true }); if (e.status === 401) return showPin(); }
}

function renderCard(confirmAmount = null) {
  const c = current;
  if (!c) { $('card-box').replaceChildren(); return; }
  const bar = el('div', { class: 'bar' }, Array.from({ length: c.goal }, (_, i) => el('i', { class: i < c.shown ? 'on' : '' })));
  const state = c.full
    ? el('div', { class: 'state full' }, 'Karta je plná: ' + (me?.rewardText || 'jídlo zdarma'))
    : el('div', { class: 'state' }, `${c.stamps} z ${c.goal} misek · zbývá ${c.left} ${misky(c.left)}`);
  const kids = [
    el('div', { class: 'card-h' }, el('b', {}, c.code), el('span', {}, ago(c.lastVisitAt))),
    bar, state,
  ];
  if (confirmAmount) {
    kids.push(el('div', { class: 'confirm' },
      el('span', {}, confirmAmount.message),
      el('div', {},
        el('button', { type: 'button', class: 'yes', onclick: () => stamp(confirmAmount.amount, true) }, 'Ano, přičíst'),
        el('button', { type: 'button', class: 'no', onclick: () => renderCard() }, 'Ne'))));
  } else {
    kids.push(el('div', { class: 'btns' },
      el('button', { type: 'button', class: 'big', onclick: () => stamp(1) }, '+ 1 miska'),
      el('button', { type: 'button', class: 'big alt', onclick: () => stamp(2) }, '+ 2'),
      el('button', { type: 'button', class: 'big alt', onclick: () => stamp(3) }, '+ 3')));
    kids.push(el('button', { type: 'button', class: 'redeem' + (c.full ? ' ready' : ''), disabled: !c.full, onclick: redeem },
      c.full ? 'Uplatnit ' + (me?.rewardText || 'jídlo zdarma').toLowerCase() : 'Uplatnit odměnu (karta ještě není plná)'));
  }
  kids.push(el('button', { type: 'button', class: 'next', onclick: () => { current = null; lastScan = ''; renderCard(); } }, 'Další host'));
  $('card-box').replaceChildren(el('div', { class: 'card' }, kids));
}

async function stamp(amount, confirm = false) {
  try {
    const r = await api(`/cards/${encodeURIComponent(current.code)}/stamp`, { amount, confirm });
    current = r.card; renderCard();
    toast(`+${amount} ${misky(amount)} · karta ${r.card.shown} z ${r.card.goal}`, { undoId: r.eventId });
    loadLog();
  } catch (e) {
    if (e.code === 'RECENT_STAMP') return renderCard({ amount, message: e.message });
    toast(e.message, { error: true });
  }
}

async function redeem() {
  try {
    const r = await api(`/cards/${encodeURIComponent(current.code)}/redeem`, {});
    current = r.card; renderCard();
    toast('Odměna uplatněna, karta začíná znovu.', { undoId: r.eventId });
    loadLog();
  } catch (e) { toast(e.message, { error: true }); }
}

async function undo(id) {
  try { const r = await api(`/events/${id}/undo`, {}); if (current && r.card.code === current.code) { current = r.card; renderCard(); } toast('Vráceno.'); loadLog(); }
  catch (e) { toast(e.message, { error: true }); }
}

async function loadLog() {
  try {
    const rows = await api('/events');
    const label = (r) => r.type === 'redeem' ? 'odměna uplatněna' : `+${r.amount} ${misky(r.amount)}`;
    $('log').replaceChildren(el('h2', {}, 'Poslední kroky'), ...rows.map((r) => el('span', { class: r.undone ? 'undone' : '' },
      `${new Date(r.created_at).toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })} · ${r.code} · ${label(r)}${r.staff_name ? ' (' + r.staff_name + ')' : ''}`)));
  } catch { /* nevadí */ }
}

// ---------- Start ----------
function showPin() {
  scanning = false; stream?.getTracks().forEach((t) => t.stop());
  $('s-main').hidden = true; $('s-pin').hidden = false; $('logout').hidden = true;
}
async function boot() {
  try { me = await api('/me'); } catch { return showPin(); }
  $('who').textContent = '(' + me.name + ')';
  $('logout').hidden = false; $('s-pin').hidden = true; $('s-main').hidden = false;
  loadLog();
}
$('logout').onclick = async () => { await api('/logout', {}).catch(() => {}); showPin(); };
$('start-cam').onclick = startCam;
$('manual').onsubmit = (e) => { e.preventDefault(); const v = $('code-in').value.trim(); if (v) { load(v); $('code-in').value = ''; } };
buildPad(); renderPin(); boot();
</script>
</body>
</html>
